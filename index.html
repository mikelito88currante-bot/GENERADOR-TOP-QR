// ─── QR GENERATOR UTILITY ─────────────────────────────────────────────────
function generateQRDataURL(text,size,fgColor,bgColor,level){
  return new Promise((resolve,reject)=>{
    try{
      const qr=new QRious({value:text,size:size,foreground:fgColor,background:bgColor,level:level||'M'});
      resolve(qr.toDataURL());
    }catch(e){reject(e);}
  });
}

const SETTINGS_KEY='pro-qr-generator-settings';

const loadSettings=()=>{try{const s=localStorage.getItem(SETTINGS_KEY);return s?JSON.parse(s):{fgColor:'#000000',bgColor:'#ffffff',level:'M'};}catch{return {fgColor:'#000000',bgColor:'#ffffff',level:'M'};}};

// ─── GENERATOR TAB ────────────────────────────────────────────────────────
function GeneratorTab({settings,folders,onSave,onCreateFolder}){
  const [input,setInput]=useState('');
  const [qrUrl,setQrUrl]=useState('');
  const [copied,setCopied]=useState(false);
  const [saving,setSaving]=useState(false);
  const [saveName,setSaveName]=useState('');
  const [folderId,setFolderId]=useState('default');
  const [newFolder,setNewFolder]=useState('');
  const [creatingFolder,setCreatingFolder]=useState(false);
  const [generating,setGenerating]=useState(false);

  const handleGenerate=async()=>{
    if(!input.trim())return;
    setGenerating(true);
    try{
      const url=await generateQRDataURL(input.trim(),512,settings.fgColor,settings.bgColor,settings.level);
      setQrUrl(url);
    }catch(e){alert('Error generando QR');}
    setGenerating(false);
  };

  const download=(fmt)=>{
    const a=document.createElement('a');
    a.href=qrUrl; a.download=`qr-${Date.now()}.${fmt}`; a.click();
  };

  const copyImg=async()=>{
    try{
      const r=await fetch(qrUrl);const b=await r.blob();
      await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);
      setCopied(true);setTimeout(()=>setCopied(false),2000);
    }catch{alert('Tu navegador no soporta copiar imágenes');}
  };

  const handleSave=()=>{
    if(!saveName.trim())return;
    let tid=folderId;
    if(creatingFolder&&newFolder.trim()){tid=onCreateFolder(newFolder.trim());}
    onSave(saveName.trim(),input.trim(),tid);
    setSaving(false);setSaveName('');
  };

  return React.createElement("div",{className:"space-y-6 anim-fade"},
    React.createElement("div",{className:"flex flex-col gap-3"},
      React.createElement("label",{className:"text-sm font-semibold text-neutral-700"},"Contenido del QR"),
      React.createElement("div",{className:"flex flex-col sm:flex-row gap-2"},
        React.createElement("input",{type:"text",value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>e.key==='Enter'&&handleGenerate(),placeholder:"Pega una URL o escribe texto...",className:"flex-1 px-4 py-3 rounded-xl border border-neutral-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"}),
        React.createElement("button",{onClick:handleGenerate,disabled:!input.trim()||generating,className:"px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-neutral-300 text-white font-semibold rounded-xl text-sm transition-all flex items-center justify-center gap-2"},
          generating?React.createElement("div",{className:"spin",style:{width:16,height:16,border:'2px solid rgba(255,255,255,.3)',borderTopColor:'white',borderRadius:'50%'}}):"Generar QR"
        )
      )
    ),
    qrUrl&&React.createElement("div",{className:"flex flex-col items-center gap-6 py-6 bg-neutral-50 rounded-2xl border border-dashed border-neutral-300"},
      React.createElement("div",{className:"p-3 bg-white rounded-xl shadow-md"},
        React.createElement("img",{src:qrUrl,width:220,height:220,alt:"QR Code"})
      ),
      React.createElement("div",{className:"flex flex-wrap justify-center gap-3 px-4 w-full max-w-lg"},
        React.createElement("button",{onClick:()=>download('png'),className:"flex-1 min-w-[110px] flex items-center justify-center gap-2 px-4 py-3 bg-neutral-800 text-white rounded-xl text-sm font-medium hover:bg-black transition-all"},
          React.createElement(Ic,{name:"download",size:16}),"PNG"),
        React.createElement("button",{onClick:()=>download('jpg'),className:"flex-1 min-w-[110px] flex items-center justify-center gap-2 px-4 py-3 bg-neutral-800 text-white rounded-xl text-sm font-medium hover:bg-black transition-all"},
          React.createElement(Ic,{name:"download",size:16}),"JPG"),
        React.createElement("button",{onClick:copyImg,className:`flex-1 min-w-[110px] flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm font-medium transition-all ${copied?'bg-green-100 text-green-700 border border-green-200':'bg-white text-neutral-800 border border-neutral-200 hover:bg-neutral-50'}`},
          React.createElement(Ic,{name:copied?"check":"copy",size:16}),copied?'Copiado':'Copiar'),

            React.createElement("label",{className:"block text-xs font-bold text-neutral-500 uppercase mb-1"},"Nombre del QR"),

          React.createElement("div",null,
            React.createElement("label",{className:"block text-xs font-bold text-neutral-500 uppercase mb-1"},"Carpeta"),
            !creatingFolder?
              React.createElement("div",{className:"flex gap-2"},
                React.createElement("select",{value:folderId,onChange:e=>setFolderId(e.target.value),className:"flex-1 px-4 py-2 border border-neutral-200 rounded-lg outline-none"},
                  folders.map(f=>React.createElement("option",{key:f.id,value:f.id},f.name))

              ):

}

// ─── MULTIPLE TAB ─────────────────────────────────────────────────────────
function MultipleTab({settings,folders,onBulkSave}){
  const [data,setData]=useState([]);
  const [fileName,setFileName]=useState('');
  const [zipping,setZipping]=useState(false);
  const [progress,setProgress]=useState(0);
  const [currentCode,setCurrentCode]=useState('');
  const [saveModal,setSaveModal]=useState(false);
  const [folderId,setFolderId]=useState('default');
  const fileRef=useRef();

  const processFile=async(file)=>{
    setFileName(file.name);
    const reader=new FileReader();
    reader.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      const rows=json.slice(1).map(r=>String(r[0]||'').trim().replace(/[;,\t]+$/,'')).filter(v=>v.length>0);
      setData(rows);
    };
    reader.readAsBinaryString(file);
  };

  const generateZip=async()=>{
    if(!data.length)return;
    setZipping(true);setProgress(0);
    const zip=new JSZip();
    const folder=zip.folder("qrcodes");
    for(let i=0;i<data.length;i++){
      const code=data[i];
      setProgress(Math.round(((i+1)/data.length)*100));
      setCurrentCode(code);
      const url=await generateQRDataURL(code,1024,settings.fgColor,settings.bgColor,settings.level);
      const b64=url.split(',')[1];
      const safe=code.substring(0,15).replace(/[^a-z0-9]/gi,'_');
      folder.file(`fila_${i+2}_${safe}.png`,b64,{base64:true});
      await new Promise(r=>setTimeout(r,10));
    }
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`qrs-masivos-${Date.now()}.zip`;
    a.click();
    setZipping(false);setCurrentCode('');
  };

  const confirmBulkSave=()=>{
    const items=data.map((c,i)=>({name:`Fila ${i+2}: ${c.substring(0,15)}`,content:c}));
    onBulkSave(items,folderId);
    setSaveModal(false);setData([]);setFileName('');
  };

  if(!data.length) return React.createElement("div",{className:"anim-fade"},
    React.createElement("div",{className:"text-center mb-6"},
      React.createElement("h2",{className:"text-2xl font-black text-neutral-800 uppercase tracking-tight"},"Generación Múltiple de QRs")
    ),
    React.createElement("div",{onClick:()=>fileRef.current?.click(),className:"border-2 border-dashed border-neutral-200 rounded-3xl p-16 text-center hover:border-blue-400 hover:bg-blue-50/30 transition-all cursor-pointer"},
      React.createElement("input",{type:"file",ref:fileRef,className:"hidden",accept:".csv,.xlsx,.xls",onChange:e=>e.target.files?.[0]&&processFile(e.target.files[0])}),
      React.createElement("div",{className:"flex flex-col items-center gap-4"},
        React.createElement("div",{className:"w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center"},
          React.createElement(Ic,{name:"upload",size:32,color:"#3b82f6"})
        ),
        React.createElement("div",null,
          React.createElement("p",{className:"text-lg font-black text-neutral-800"},"Cargar Excel o CSV"),
          React.createElement("p",{className:"text-xs text-neutral-400 font-bold uppercase mt-1 tracking-tight italic"},"Solo se procesará la Columna A")
        )
      )
    )
  );

  return React.createElement("div",{className:"space-y-6 anim-fade"},
    React.createElement("div",{className:"text-center mb-2"},
      React.createElement("h2",{className:"text-2xl font-black text-neutral-800 uppercase tracking-tight"},"Generación Múltiple de QRs")
    ),
    React.createElement("div",{className:"flex items-center justify-between bg-white p-5 rounded-2xl border border-neutral-200 shadow-sm"},
      React.createElement("div",{className:"flex items-center gap-4"},
        React.createElement("div",{className:"w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center"},
          React.createElement(Ic,{name:"filesheet",size:20,color:"#16a34a"})
        ),
        React.createElement("div",null,
          React.createElement("div",{className:"text-sm font-black text-neutral-800 truncate max-w-[200px]"},fileName),
          React.createElement("div",{className:"text-xs font-bold text-green-600 uppercase tracking-widest"},data.length+" códigos detectados")
        )
      ),
      React.createElement("button",{onClick:()=>{setData([]);setFileName('');},className:"p-2 hover:bg-neutral-100 rounded-full transition-colors text-neutral-400"},
        React.createElement(Ic,{name:"x",size:18})
      )

function App(){

  };

    const qrs=items.map(it=>({id:crypto.randomUUID(),name:it.name,content:it.content,settings:{...settings},createdAt:Date.now()}));

// PWA install
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  const b=document.getElementById('installBanner');
  if(b){b.classList.remove('hidden');b.classList.add('flex');}
});
document.getElementById('installBtn')?.addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  if(outcome==='accepted'){
    const b=document.getElementById('installBanner');
    b.classList.add('hidden');b.classList.remove('flex');
  }
});
window.addEventListener('appinstalled',()=>{
  const b=document.getElementById('installBanner');
  if(b){b.classList.add('hidden');b.classList.remove('flex');}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
